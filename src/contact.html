<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="x-ua-compatible" content="ie=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Portfolio Home Page" />
        <title>Chris Autullo | Contact</title>
        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    <body class="h-screen w-screen bg-black">
        <div class="bg-black text-white">
            <div id="navbar"></div>
            <main>
                <div
                    class="flex w-screen min-h-screen m-auto p-4 border-t border-white/30 bg-blue-900 lg:p-10 sm:p-6"
                >
                    <div
                        class="h-fit w-full m-auto md:w-2/3 p-3 bg-white/80 shadow-[15px_20px_0px_0px_#000] lg:w-1/2 sm:p-4 sm:w-4/5"
                    >
                        <div class="border-3 border-black">
                            <div class="p-6">
                                <form
                                    action="https://formspree.io/f/mlgkayny"
                                    method="POST"
                                    class="flex flex-col gap-5"
                                >
                                    <div
                                        class="m-auto text-black text-xl font-mono"
                                    >
                                        [ Contact-Form ]
                                    </div>
                                    <div
                                        class="flex flex-col min-[1300px]:flex-row min-[1300px]:items-center"
                                    >
                                        <label
                                            for="name"
                                            class="w-full md:w-1/5 text-base text-black font-mono shrink-0 sm:text-lg sm:w-1/4"
                                            >Name&nbsp;&nbsp;&nbsp;&nbsp;:</label
                                        >
                                        <input
                                            type="text"
                                            maxlength="255"
                                            id="name"
                                            name="name"
                                            required
                                            class="flex-1 border-b-2 border-black text-black text-lg font-mono outline-none"
                                        />
                                    </div>

                                    <div
                                        class="flex flex-col min-[1300px]:flex-row min-[1300px]:items-center"
                                    >
                                        <label
                                            for="email"
                                            class="w-full md:w-1/5 text-base text-black font-mono shrink-0 sm:text-lg sm:w-1/4"
                                            >Email&nbsp;&nbsp;&nbsp;:</label
                                        >
                                        <input
                                            type="email"
                                            maxlength="255"
                                            id="email"
                                            name="email"
                                            required
                                            class="flex-1 border-b-2 border-black text-black text-lg font-mono outline-none"
                                        />
                                    </div>

                                    <div
                                        class="flex flex-col min-[1300px]:flex-row min-[1300px]:items-center"
                                    >
                                        <label
                                            for="subject"
                                            class="w-full md:w-1/5 text-base text-black font-mono shrink-0 sm:text-lg sm:w-1/4"
                                            >Subject&nbsp;:</label
                                        >
                                        <input
                                            type="text"
                                            required
                                            maxlength="255"
                                            id="subject"
                                            name="subject"
                                            class="flex-1 border-b-2 border-black text-black text-lg font-mono outline-none"
                                        />
                                    </div>

                                    <div class="flex flex-col gap-1.5">
                                        <label
                                            for="message"
                                            class="text-base text-black font-mono sm:text-lg"
                                            >Message :</label
                                        >
                                        <textarea
                                            id="message"
                                            name="message"
                                            maxlength="2000"
                                            rows="6"
                                            required
                                            class="px-3 py-2 border-2 border-black text-base text-black font-mono outline-none resize-y sm:text-lg"
                                        ></textarea>
                                    </div>

                                    <input
                                        type="text"
                                        name="_gotcha"
                                        class="hidden"
                                    />
                                    <div class="flex">
                                        <button
                                            type="submit"
                                            class="h-fit w-fit m-auto px-2 py-1 text-base text-black font-mono hover:bg-red-700 hover:text-white self-start sm:text-lg"
                                        >
                                            &lt;Submit&gt;
                                        </button>
                                        <button
                                            type="reset"
                                            class="h-fit w-fit m-auto px-2 py-1 text-base text-black font-mono hover:bg-red-700 hover:text-white self-start sm:text-lg"
                                        >
                                            &lt;Reset&gt;
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
            <div id="footer"></div>
        </div>
    </body>
    <script src="/js/components.js"></script>
</html>
